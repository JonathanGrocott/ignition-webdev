name: Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: wrapper

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build and test all modules
      run: ./gradlew clean build

    - name: Sign module
      run: ./scripts/sign-module.sh

    - name: Verify signed module
      run: |
        unzip -l webcompat-build/build/webdev-compat.modl | grep -q "certificates.p7b"
        unzip -l webcompat-build/build/webdev-compat.modl | grep -q "signatures.properties"

    - name: Upload module artifact
      uses: actions/upload-artifact@v4
      with:
        name: webdev-compat-module
        path: |
          webcompat-build/build/*.modl
          !webcompat-build/build/*.unsigned.modl
        retention-days: 30
