name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: wrapper

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build and test all modules
      run: ./gradlew clean build

    - name: Sign module
      run: ./scripts/sign-module.sh

    - name: Get version from gradle.properties
      id: get_version
      run: |
        VERSION=$(grep "^moduleVersion=" gradle.properties | cut -d'=' -f2)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Module version: $VERSION"

    - name: Verify tag matches module version
      if: github.ref_type == 'tag'
      run: |
        EXPECTED_TAG="v$VERSION"
        if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
          echo "Tag $GITHUB_REF_NAME does not match module version $VERSION; expected $EXPECTED_TAG" >&2
          exit 1
        fi

    - name: Find .modl file
      id: find_modl
      run: |
        MODL_FILE=$(find webcompat-build/build -name "*.modl" ! -name "*.unsigned.modl" -type f | head -1)
        test -n "$MODL_FILE"
        unzip -l "$MODL_FILE" | grep -q "certificates.p7b"
        unzip -l "$MODL_FILE" | grep -q "signatures.properties"
        echo "MODL_FILE=$MODL_FILE" >> $GITHUB_ENV
        echo "Found module file: $MODL_FILE"

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'SNAPSHOT') }}
        body: |
          ## WebDevCompat Module
          Version: ${{ env.VERSION }}

          ### Installation
          1. Download `webdev-compat.modl` from this release.
          2. In the Ignition Gateway, open **Platform > System > Modules** and select **Install or Upgrade Module**.
          3. Choose the downloaded file, review the signing certificate if prompted, and verify that WebDevCompat is active.

          WebDevCompat registers `/system/webdev/*`. With Event Streams installed and enabled, it also registers `/system/eventstream/*`. Ensure the applicable routes are available before enabling WebDevCompat.

          ### Changes
          See the commit history for details on changes in this release.
        files: |
          ${{ env.MODL_FILE }}
